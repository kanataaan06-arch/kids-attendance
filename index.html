<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キッズ講師 出欠管理（試作）</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f5f7fb;color:#263044;margin:0}header{background:#fff;padding:18px 16px;border-bottom:1px solid #ddd}main{max-width:780px;margin:auto;padding:16px}h1{font-size:20px;margin:0 0 6px}.muted{color:#697386;font-size:12px}.tabs,.actions,.people{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:14px 0}button,select,input{font:inherit;border:1px solid #cdd4df;border-radius:9px;padding:10px;background:white}button{cursor:pointer}.active,.primary{background:#2463db;color:white;border-color:#2463db}.card{background:white;border:1px solid #e0e5ed;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 5px #00000008}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.place{color:#697386;margin:7px 0 13px}.person{background:#f3f5f9;border-radius:8px;padding:7px 9px;font-size:13px}.yes{color:#16824a;font-weight:bold}.no{color:#c43d43;font-weight:bold}.maybe{color:#aa7600;font-weight:bold}.unknown{color:#89909e;font-weight:bold}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.fields input,.fields select{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.status{padding:7px 10px}.status.sel{background:#dce9ff;border-color:#2463db}.hidden{display:none}textarea{width:100%;box-sizing:border-box;min-height:120px;padding:10px;border-radius:9px;border:1px solid #cdd4df}details{margin-top:10px}summary{cursor:pointer;color:#2463db}footer{padding:15px;color:#697386;font-size:12px;text-align:center}@media(max-width:500px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.person{font-size:12px;padding:6px}.card{padding:12px}}</style></head><body><header><h1>🎭 キッズ講師 出欠管理</h1><div class="muted">試作品・この端末のブラウザ内だけに保存されます（5人共有は未対応）</div></header><main><div class="row"><label>操作する講師 <select id="who"></select></label><span class="muted">試作のため自由に切替可能。本番では本人認証で固定します。</span></div><nav class="tabs"><button data-tab="future" class="active">今後の活動</button><button data-tab="bulk">まとめて回答</button><button data-tab="create">予定を登録</button><button data-tab="past">過去の活動</button></nav><section id="future"></section><section id="bulk" class="hidden"></section><section id="create" class="hidden"><div class="card"><h3>予定をまとめて登録</h3><p class="muted">日付を1行に1件入力。すべて同じ時間・場所で登録した後、個別に変更できます。</p><label>日付（例：2026-11-07）<textarea id="dates" placeholder="2026-11-07&#10;2026-11-14&#10;2026-11-21"></textarea></label><div class="fields"><label>開始時間<input id="start" type="time" value="19:00"></label><label>終了時間<input id="end" type="time" value="21:00"></label><label class="wide">活動場所<select id="place"></select></label></div><p><button class="primary" id="add">まとめて登録する</button></p></div><div class="card"><h3>場所を追加</h3><div class="row"><input id="newplace" placeholder="例：市民会館 第2会議室"><button id="addplace">追加</button></div></div></section><section id="past" class="hidden"></section><div class="row"><button id="reset">試作データを初期化</button></div></main><footer>このHTMLはオフライン試作品です。Googleログイン・クラウド保存・他人の回答の編集制限は未実装です。</footer><script>
const KEY='kids_attendance_proto_v1';const names=['自分','講師A','講師B','講師C','講師D'];const today=new Date();today.setHours(0,0,0,0);const iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function plus(n){let d=new Date(today);d.setDate(d.getDate()+n);return iso(d)}const initial=()=>({places:['活動場所A','活動場所B','活動場所C'],events:[{id:1,date:plus(2),start:'13:00',end:'17:00',place:'活動場所A',answers:['○','○','×','○','△']},{id:2,date:plus(9),start:'18:30',end:'21:00',place:'活動場所B',answers:['○','×','○','△','○']},{id:3,date:plus(16),start:'19:00',end:'21:00',place:'活動場所A',answers:['△','○','○','○','×']},{id:4,date:plus(-7),start:'19:00',end:'21:00',place:'活動場所C',answers:['○','○','×','○','○']} ]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}let who=0,tab='future';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dateLabel(s){let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`}function status(s){return `<span class="${s==='○'?'yes':s==='×'?'no':s==='△'?'maybe':'unknown'}">${s}</span>`}function card(e){return `<article class="card"><div class="top"><strong>${dateLabel(e.date)}</strong><strong>${esc(e.start)}〜${esc(e.end)}</strong></div><div class="place">📍 ${esc(e.place)}</div><div class="people">${names.map((n,i)=>`<div class="person">${esc(n)} ${status(e.answers[i]||'－')}</div>`).join('')}</div><details><summary>自分の出欠を変更 / 予定を編集</summary><div class="row">${['○','△','×'].map(s=>`<button class="status ${e.answers[who]===s?'sel':''}" data-answer="${e.id}" data-value="${s}">${s==='○'?'○ 参加':s==='△'?'△ 未定':'× 欠席'}</button>`).join('')}</div><div class="fields"><label>日付<input type="date" data-field="date" data-id="${e.id}" value="${e.date}"></label><label>場所<select data-field="place" data-id="${e.id}">${data.places.map(p=>`<option ${p===e.place?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label>開始<input type="time" data-field="start" data-id="${e.id}" value="${e.start}"></label><label>終了<input type="time" data-field="end" data-id="${e.id}" value="${e.end}"></label></div><p class="small muted">予定の編集は全員可能。出欠は選択した講師本人の分だけ変更します。</p></details></article>`}function render(){ $('who').innerHTML=names.map((n,i)=>`<option value="${i}" ${i===who?'selected':''}>${esc(n)}</option>`).join('');$('place').innerHTML=data.places.map(p=>`<option>${esc(p)}</option>`).join('');for(let t of ['future','bulk','create','past']){$(t).classList.toggle('hidden',t!==tab);document.querySelector(`[data-tab="${t}"]`).classList.toggle('active',t===tab)}const sorted=[...data.events].sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));const upcoming=sorted.filter(e=>e.date>=iso(today)),past=sorted.filter(e=>e.date<iso(today)).reverse();$('future').innerHTML=upcoming.length?upcoming.map(card).join(''):'<div class="card">今後の活動はありません。</div>';$('past').innerHTML=past.length?past.map(card).join(''):'<div class="card">過去の活動はありません。</div>';$('bulk').innerHTML=`<div class="card"><h3>${esc(names[who])}の出欠をまとめて回答</h3><p class="muted">各日付の○△×を選んで、最後にまとめて保存します。</p>${upcoming.map(e=>`<div class="row"><strong>${dateLabel(e.date)}</strong><span class="small">${esc(e.start)} ${esc(e.place)}</span><select class="bulk-answer" data-id="${e.id}">${['－','○','△','×'].map(s=>`<option ${s===(e.answers[who]||'－')?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}<button class="primary" id="savebulk">まとめて保存</button></div>`;const b=$('savebulk');if(b)b.onclick=()=>{document.querySelectorAll('.bulk-answer').forEach(el=>{const e=data.events.find(e=>e.id===Number(el.dataset.id));if(e)e.answers[who]=el.value});save();tab='future';render();alert('まとめて保存しました（この端末のみ）')}}document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.tab){tab=btn.dataset.tab;render()}if(btn.dataset.answer){const item=data.events.find(x=>x.id===Number(btn.dataset.answer));if(item){item.answers[who]=btn.dataset.value;save();render()}}});document.addEventListener('change',e=>{if(e.target.id==='who'){who=Number(e.target.value);render()}if(e.target.dataset.field){let item=data.events.find(x=>x.id===Number(e.target.dataset.id));if(item){item[e.target.dataset.field]=e.target.value;save();render()}}});$('add').onclick=()=>{const dates=$('dates').value.split(/[\n,、\s]+/).map(s=>s.trim()).filter(Boolean);if(!dates.length||dates.some(s=>!/^\d{4}-\d{2}-\d{2}$/.test(s)||Number.isNaN(new Date(s+'T12:00:00').getTime()))){alert('日付を YYYY-MM-DD 形式で入力してください');return}for(const date of dates)data.events.push({id:Date.now()+Math.random(),date,start:$('start').value,end:$('end').value,place:$('place').value,answers:['－','－','－','－','－']});save();$('dates').value='';tab='future';render()};$('addplace').onclick=()=>{let p=$('newplace').value.trim();if(!p)return;if(!data.places.includes(p))data.places.push(p);$('newplace').value='';save();render()};$('reset').onclick=()=>{if(confirm('この端末の試作データを初期化しますか？')){data=initial();save();tab='future';render()}};render();
</script></body></html>
