// Japanese national holidays, including substitute holidays and citizens' holidays (2000–2099).
const holidayCache=new Map();
function japaneseHolidays(year){
  if(holidayCache.has(year))return holidayCache.get(year);
  const holidays=new Set();
  const add=(month,day)=>holidays.add(year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0'));
  const nthMonday=(month,n)=>{const first=new Date(Date.UTC(year,month-1,1)).getUTCDay();return 1+(8-first)%7+(n-1)*7};
  const spring=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
  const autumn=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));
  add(1,1);add(1,nthMonday(1,2));add(2,11);
  if(year>=2020)add(2,23);
  add(3,spring);add(4,29);add(5,3);add(5,4);add(5,5);
  if(year===2020){add(7,23);add(8,10);add(9,nthMonday(9,3));add(9,autumn);add(11,3);add(11,23);add(7,24)}
  else if(year===2021){add(7,22);add(7,23);add(8,8);add(9,nthMonday(9,3));add(9,autumn);add(11,3);add(11,23)}
  else{add(7,nthMonday(7,3));if(year>=2016)add(8,11);add(9,nthMonday(9,3));add(9,autumn);add(10,nthMonday(10,2));add(11,3);add(11,23)}

  // A one-off national holiday for the enthronement in 2019.
  if(year===2019){add(5,1);add(10,22)}
  const key=d=>d.toISOString().slice(0,10);
  const start=new Date(Date.UTC(year,0,1)),end=new Date(Date.UTC(year+1,0,1));
  // Citizens' holidays: a weekday between two national holidays.
  for(let d=new Date(start);d<end;d.setUTCDate(d.getUTCDate()+1)){
    if(d.getUTCDay()===0||holidays.has(key(d)))continue;
    const prev=new Date(d),next=new Date(d);prev.setUTCDate(prev.getUTCDate()-1);next.setUTCDate(next.getUTCDate()+1);
    if(holidays.has(key(prev))&&holidays.has(key(next)))holidays.add(key(d));

  // Sunday national holidays shift to the first following non-holiday.
  for(const h of national){const d=new Date(h+'T00:00:00Z');if(d.getUTCDay()!==0)continue;

}

async function executeBulkDelete(){
  if(profile?.role!=='admin'||!deleteConfirm||deleteBusy)return;
  const targets=events.filter(e=>deleteSelection.has(e.id));if(!targets.length)return;
  if(!confirm(targets.length+'件の予定と全員の出欠回答を完全に削除します。\\n元に戻せません。実行しますか？'))return;
  deleteBusy=true;renderDeleteManager();
  let done=0;const errors=[];
  // Optimize only deletion. Keep the proven login and Firestore listeners unchanged.
  // Five events per batch reduces round trips while keeping writes well below Firestore limits.
  const groups=[];for(let i=0;i<targets.length;i+=10)groups.push(targets.slice(i,i+10));
  let nextGroup=0;
  async function deleteWorker(){
    while(nextGroup<groups.length){
      const group=groups[nextGroup++];
      try{
        // Fetch the five answer subcollections at the same time.
        const answers=await Promise.all(group.map(e=>getDocs(collection(db,'events',e.id,'answers'))));
        const writeCount=group.length+answers.reduce((sum,snapshot)=>sum+snapshot.size,0);
        if(writeCount>400)throw new Error('回答データが多すぎます。対象を減らして再実行してください。');
        const batch=writeBatch(db);
        group.forEach((e,i)=>{
          answers[i].docs.forEach(answer=>batch.delete(answer.ref));
          batch.delete(doc(db,'events',e.id));
        });
        // Event documents and their answers are removed atomically per group.
        await batch.commit();
        group.forEach(e=>{deleteSelection.delete(e.id);bulkDrafts.delete(e.id)});
        done+=group.length;
      }catch(error){
        console.error('予定の一括削除に失敗:',error);
        errors.push(error);
      }
    }
  }
  try{
    // Limit concurrency to avoid flooding Firestore and the UI.
    await Promise.all(Array.from({length:Math.min(4,groups.length)},()=>deleteWorker()));
    deleteConfirm=false;
    if(errors.length)notify(done+'件を削除しました。残り'+(targets.length-done)+'件は削除できませんでした：'+(errors[0]?.message||String(errors[0])),true);
    else notify(done+'件の予定と出欠回答を削除しました');
  }finally{deleteBusy=false;render();}
}

    row.append(document.createTextNode(dateLabel(d)));
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',dateLabel(d)+'を解除');
    x.onclick=()=>{selectedDates.delete(d);redrawDates()};row.append(x);root.append(row);
  }
  drawCalendar();
}
redrawDates();
document.querySelectorAll('input[name="kindPreset"]').forEach(el=>el.addEventListener('change',()=>{$('customLabel').classList.toggle('hidden',document.querySelector('input[name="kindPreset"]:checked')?.value!=='other')}));
$('add').onclick=async()=>{if(!profile)return;const dates=[...selectedDates];const chosenKind=document.querySelector('input[name="kindPreset"]:checked')?.value||'通常活動';const kind=chosenKind==='other'?$('customKind').value.trim():chosenKind;updateTimePreset();if(!dates.length){alert('カレンダーから日付を選択してください');return}if(!kind){alert('イベント名を入力してください');return}const selectedPlace=document.querySelector('input[name="placePreset"]:checked')?.value||'里山';const place=selectedPlace==='自由入力'?$('customPlace').value.trim():selectedPlace;if(!place){alert('活動場所を入力してください');return}try{await Promise.all(dates.map(date=>addDoc(collection(db,'events'),{date,start:$('start').value,end:$('end').value,place,kind,allDay:$('allDay').checked,createdBy:me.uid,createdAt:serverTimestamp()})));selectedDates.clear();redrawDates();tab='future';notify('予定を登録しました');render()}catch(e){fail(e)}};

$('savemyname').onclick=async()=>{if(!me)return;const name=$('mynameinput').value.trim();if(!name||name.length>30){alert('表示名を1〜30文字で入力してください');return}const btn=$('savemyname');btn.disabled=true;try{await setDoc(doc(db,'userProfiles',me.uid),{name,updatedAt:serverTimestamp()});myPendingName=name;if(profile){await updateDoc(doc(db,'members',me.uid),{name});profile.name=name;$('authstate').textContent='ログイン中：'+name;render()}else{$('mynamehint').textContent='登録名：'+name+'（承認を待っています）'}alert('表示名を保存しました')}catch(e){console.error(e);alert('名前を保存できませんでした。Firestoreルールを確認してください。\n'+e.message)}finally{btn.disabled=false}};
$('addmember').onclick=async()=>{if(profile?.role!=='admin')return;const uid=$('memberuid').value.trim();if(!uid){alert('ユーザーIDを入力してください');return}if(members.some(m=>m.id===uid)){alert('この人はすでに登録済みです');return}if(members.length>=10){alert('メンバーは10人までです');return}try{const nameSnap=await getDoc(doc(db,'userProfiles',uid));const name=nameSnap.exists()?nameSnap.data().name?.trim():'';if(!name){alert('相手の名前が未登録です。本人に名前を保存してもらってください');return}await setDoc(doc(db,'members',uid),{name,role:'member',order:members.length});$('memberuid').value='';notify(name+'さんを承認しました。相手にページを再読み込みしてもらってください')}catch(e){fail(e)}};

</script></body></html>
