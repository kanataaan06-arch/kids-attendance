<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キッズ活動出欠管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f5f7fb;color:#263044;margin:0}header{background:#fff;padding:18px 16px;border-bottom:1px solid #ddd}main{max-width:780px;margin:auto;padding:16px}h1{font-size:20px;margin:0 0 6px}.muted{color:#697386;font-size:12px}.tabs,.actions,.people{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:14px 0}button,select,input{font:inherit;border:1px solid #cdd4df;border-radius:9px;padding:10px;background:white}button{cursor:pointer}.active,.primary{background:#2463db;color:white;border-color:#2463db}.card{background:white;border:1px solid #e0e5ed;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 5px #00000008}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.place{color:#697386;margin:7px 0 13px}.person{background:#f3f5f9;border-radius:8px;padding:7px 9px;font-size:13px}.yes{color:#16824a;font-weight:bold}.no{color:#c43d43;font-weight:bold}.maybe{color:#aa7600;font-weight:bold}.unknown{color:#89909e;font-weight:bold}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px}.fields input,.fields select{width:100%;box-sizing:border-box}.wide{grid-column:1/-1}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.status{padding:7px 10px}.status.sel{background:#dce9ff;border-color:#2463db}.bulk-entry{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #e8ecf2}.bulk-entry:last-of-type{border-bottom:0}.bulk-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1 1 260px}.bulk-options{display:flex;gap:8px;flex-wrap:wrap}.bulk-choice{cursor:pointer;display:inline-flex;position:relative}.bulk-choice input{position:absolute;opacity:0;width:1px;height:1px;padding:0;margin:0}.bulk-choice span{display:flex;align-items:center;justify-content:center;min-width:46px;min-height:44px;box-sizing:border-box;padding:8px 13px;border:1px solid #cdd4df;border-radius:10px;background:#fff;color:#263044;font-weight:700;font-size:20px;transition:background .12s,border-color .12s,color .12s}.bulk-choice input:checked+span{background:#16824a;color:#fff;border-color:#16824a}.bulk-choice input:focus-visible+span{outline:3px solid #2463db;outline-offset:2px}@media(max-width:500px){.bulk-entry{align-items:flex-start}.bulk-info{flex-basis:100%}.bulk-options{width:100%}.bulk-choice{flex:1}.bulk-choice span{width:100%}}.hidden{display:none}textarea{width:100%;box-sizing:border-box;min-height:120px;padding:10px;border-radius:9px;border:1px solid #cdd4df}details{margin-top:10px}summary{cursor:pointer;color:#2463db}footer{padding:15px;color:#697386;font-size:12px;text-align:center}@media(max-width:500px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.person{font-size:12px;padding:6px}.card{padding:12px}}
.authbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}.notice{background:#fff7e4;border:1px solid #ead7a2;padding:12px;border-radius:10px;margin:12px 0}.error{background:#fff0f0;color:#a32323}.admin{border:1px solid #dce2ee;padding:12px;border-radius:12px;margin-top:12px}.uid{overflow-wrap:anywhere;font-size:12px;background:#eef2f9;padding:10px;border-radius:8px}.people{margin:10px 0}.status{min-width:80px}.danger{color:#b42d2d}.hidden{display:none!important}</style></head><body>
<header><h1>キッズ活動出欠管理</h1><div class="muted">Googleログイン 10人まで</div></header><main>
<div id="auth" class="card"><strong id="authstate">ログインしてください</strong><div class="authbar"><span id="identity" class="muted"></span><button id="login" class="primary">Googleでログイン</button><button id="logout" class="hidden">ログアウト</button></div><div id="myname" class="hidden"><div class="row"><label for="mynameinput">自分の表示名</label><input id="mynameinput" maxlength="30" placeholder="例：かなこ"><button id="savemyname">名前を保存</button></div><p id="mynamehint" class="muted"></p></div><div id="pending" class="hidden notice"><strong>承認待ちです</strong><p>管理者に登録してもらうまで予定は表示されません。</p><div class="uid" id="uid"></div><button id="copyuid">ユーザーIDをコピー</button></div></div>
<div id="app" class="hidden"><nav class="tabs"><button data-tab="future" class="active">今後の活動</button><button data-tab="bulk">まとめて回答</button><button data-tab="create">予定を登録</button><button data-tab="past">過去の活動</button><button data-tab="members" id="membersTab" class="hidden">メンバーの管理</button></nav>
<div id="message" class="hidden notice"></div><section id="future"></section><section id="bulk" class="hidden"></section>
<section id="create" class="hidden"><div class="card"><h3>予定をまとめて登録</h3><p class="muted">カレンダーで日付を選び「日付を追加」を押してください。複数日登録できます。</p><label>日付（例：2026-11-07）<input id="pickdate" type="date"><button id="pushdate" type="button">日付を追加</button><div id="chosenDates"></div></label><div class="fields"><label class="wide">活動の種類<select id="kind"><option>通常活動</option><option>あそぼう</option><option>忍者</option><option value="other">その他（自由入力）</option></select></label><label id="customLabel" class="wide hidden">イベント名<input id="customKind" placeholder="イベント名"></label><label class="wide" style="flex-direction:row;align-items:center"><input id="allDay" type="checkbox" style="width:auto"> 終日（時間指定なし）</label><label>開始時間<input id="start" type="time" value="19:00"></label><label>終了時間<input id="end" type="time" value="21:00"></label><label class="wide">活動場所<select id="place"></select></label></div><p><button class="primary" id="add">まとめて登録する</button></p></div><div class="card"><h3>場所を追加</h3><div class="row"><input id="newplace" placeholder="例：市民会館 第2会議室"><button id="addplace">追加</button></div></div></section>
<section id="past" class="hidden"></section><section id="members" class="hidden"><div class="card"><h3>メンバーの管理（管理者のみ）</h3><p class="muted">相手が一度Googleログインして表示されたユーザーIDを登録します。合計10人まで。</p><label>ユーザーID（UID）<input id="memberuid" placeholder="相手が送ってくれたユーザーID"></label><p class="muted">表示名は本人が登録します。管理者が入力する必要はありません。</p><p><button id="addmember" class="primary">メンバーを承認する</button></p><div id="memberlist"></div></div></section></div>
</main><footer>ログイン認証とFirestoreルールでアクセスを制御します。実運用前にルールを設定してください。</footer>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCbE1BqIxMGke2vT4FcyZKWLqQX6YmzEsU',authDomain:'kids-attendance-b89d4.firebaseapp.com',projectId:'kids-attendance-b89d4',storageBucket:'kids-attendance-b89d4.firebasestorage.app',messagingSenderId:'408668881637',appId:'1:408668881637:web:63464582c7bd720949ca0c'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bulkDrafts=new Map();let myPendingName='',me=null,profile=null,members=[],events=[],places=[],tab='future',unsubs=[],answerUnsubs=[];
const clean=()=>{[...unsubs,...answerUnsubs].forEach(fn=>fn());unsubs=[];answerUnsubs=[];members=[];events=[];places=[];profile=null;myPendingName=''};
function notify(s,bad=false){$('message').textContent=s;$('message').className='notice'+(bad?' error':'');}
function fail(e){console.error(e);notify('操作できませんでした：'+(e?.message||String(e)),true)}
const dateLabel=s=>{let d=new Date(s+'T12:00:00');return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`};
const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function status(s){return `<span class="${s==='○'?'yes':s==='×'?'no':s==='△'?'maybe':'unknown'}">${esc(s||'－')}</span>`}
function nameFor(uid){return members.find(m=>m.id===uid)?.name||'メンバー'}
function card(e){return `<article class="card"><div class="top"><strong>${dateLabel(e.date)}</strong><strong>${e.allDay?"終日":esc(e.start)+"〜"+esc(e.end)}</strong></div><div class="place">🎭 ${esc(e.kind||"通常活動")}　📍 ${esc(e.place)}</div><div class="people">${members.map(m=>`<div class="person">${esc(m.name)} ${status(e.answers?.[m.id])}</div>`).join('')}</div><details><summary>${profile.role==='admin'?'自分の出欠を変更 / 予定を編集':'自分の出欠を変更'}</summary><div class="row">${['○','△','×'].map(s=>`<button class="status ${e.answers?.[me.uid]===s?'sel':''}" data-answer="${esc(e.id)}" data-value="${s}">${s==='○'?'○ 参加':s==='△'?'△ 未定':'× 欠席'}</button>`).join('')}</div>${profile.role==='admin'?`<div class="fields"><label class="wide">活動名<input data-field="kind" data-id="${esc(e.id)}" value="${esc(e.kind||'通常活動')}"></label><label>日付<input type="date" data-field="date" data-id="${esc(e.id)}" value="${esc(e.date)}"></label><label>場所<select data-field="place" data-id="${esc(e.id)}">${places.map(p=>`<option ${p===e.place?'selected':''}>${esc(p)}</option>`).join('')}</select></label><label class="wide" style="flex-direction:row;align-items:center"><input type="checkbox" data-field="allDay" data-id="${esc(e.id)}" ${e.allDay?"checked":""} style="width:auto"> 終日</label><label>開始<input type="time" data-field="start" data-id="${esc(e.id)}" value="${esc(e.start)}" ${e.allDay?"disabled":""}></label><label>終了<input type="time" data-field="end" data-id="${esc(e.id)}" value="${esc(e.end)}" ${e.allDay?"disabled":""}></label></div><div class="row"><button type="button" class="danger" data-delete-event="${esc(e.id)}">この予定を削除</button></div><p class="small muted">出欠は本人のみ変更可能。予定の編集・削除は管理者のみ可能。</p>`:'<p class="small muted">出欠はいつでも本人だけが変更できます。</p>'}</details></article>`}
function render(){if(!profile||!me)return;let ts=today(),sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));let future=sorted.filter(e=>e.date>=ts),past=sorted.filter(e=>e.date<ts).reverse();for(let t of ['future','bulk','create','past','members']){$(t).classList.toggle('hidden',t!==tab);document.querySelector(`[data-tab="${t}"]`)?.classList.toggle('active',t===tab)}$('membersTab').classList.toggle('hidden',profile.role!=='admin');if(profile.role!=='admin'&&tab==='members'){tab='future';return render()}$('future').innerHTML=future.length?future.map(card).join(''):'<div class="card">今後の活動はありません。</div>';$('past').innerHTML=past.length?past.map(card).join(''):'<div class="card">過去の活動はありません。</div>';$('place').innerHTML=places.map(p=>`<option>${esc(p)}</option>`).join('');$('bulk').innerHTML=`<div class="card"><h3>${esc(profile.name)}の出欠をまとめて回答</h3><p class="muted">○・△・×をタップして選択し、最後に「まとめて保存」を押してください。</p>${future.map(e=>`<div class="bulk-entry"><div class="bulk-info"><strong>${dateLabel(e.date)}</strong><span class="small">${e.allDay?"終日":esc(e.start)} ${esc(e.kind||"通常活動")}・${esc(e.place)}</span></div><div class="bulk-options" role="radiogroup" aria-label="${esc(e.date)}の出欠">${['○','△','×'].map(v=>`<label class="bulk-choice"><input type="radio" class="bulk-answer" name="bulk-${esc(e.id)}" data-id="${esc(e.id)}" value="${v}" ${v===(bulkDrafts.has(e.id)?bulkDrafts.get(e.id):e.answers?.[me.uid])?'checked':''}><span>${v}</span></label>`).join('')}</div></div>`).join('')}<div class="row"><button class="primary" id="savebulk">まとめて保存</button></div></div>`;$('savebulk').onclick=async()=>{const entries=[...document.querySelectorAll('.bulk-answer:checked')];const btn=$('savebulk');btn.disabled=true;try{await Promise.all(entries.map(el=>setDoc(doc(db,'events',el.dataset.id,'answers',me.uid),{value:el.value,updatedAt:serverTimestamp()})));bulkDrafts.clear();tab='future';notify('出欠を保存しました');render()}catch(e){fail(e)}finally{btn.disabled=false}};
$('memberlist').innerHTML=members.map(m=>`<div class="row"><span>${esc(m.name)}（${m.role==='admin'?'管理者':'メンバー'}）</span><span class="muted">${esc(m.id)}</span>${m.role!=='admin'?`<button data-remove="${esc(m.id)}" class="danger">承認を取り消す</button>`:''}</div>`).join('')}
async function watch(){clean();let snap=await getDoc(doc(db,'members',me.uid));if(!snap.exists()){showPending();return}profile={id:me.uid,...snap.data()};$('mynameinput').value=profile.name||'';$('mynamehint').textContent='名前はいつでも変更できます。';$('pending').classList.add('hidden');$('app').classList.remove('hidden');$('authstate').textContent='ログイン中：'+profile.name;
unsubs.push(onSnapshot(collection(db,'members'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??99)-(b.order??99));const own=members.find(m=>m.id===me.uid);if(own){profile={...own};$('authstate').textContent='ログイン中：'+own.name}render()},fail));
unsubs.push(onSnapshot(collection(db,'places'),s=>{places=s.docs.map(d=>d.data().name).sort();render()},fail));
unsubs.push(onSnapshot(collection(db,'events'),s=>{answerUnsubs.forEach(fn=>fn());answerUnsubs=[];events=s.docs.map(d=>({id:d.id,...d.data(),answers:{}}));for(const e of events){answerUnsubs.push(onSnapshot(collection(db,'events',e.id,'answers'),ans=>{let target=events.find(x=>x.id===e.id);if(target){target.answers=Object.fromEntries(ans.docs.map(a=>[a.id,a.data().value]));render()}},fail))}render()},fail));}
function showPending(){$('app').classList.add('hidden');$('pending').classList.remove('hidden');$('uid').textContent=me.uid;$('authstate').textContent='承認待ち';$('mynamehint').textContent=myPendingName?'登録名：'+myPendingName+'（承認を待っています）':'先に表示名を登録してください。';}
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,provider)}else{alert('ログインに失敗しました：'+e.message)}}};$('logout').onclick=()=>signOut(auth);$('copyuid').onclick=()=>navigator.clipboard.writeText(me.uid).then(()=>alert('コピーしました')).catch(()=>alert('コピーできない場合は表示されたIDを選択してください'));
onAuthStateChanged(auth,async user=>{clean();me=user;$('login').classList.toggle('hidden',!!user);$('logout').classList.toggle('hidden',!user);$('identity').textContent=user?.email||'';if(!user){$('myname').classList.add('hidden');$('authstate').textContent='ログインしてください';$('app').classList.add('hidden');$('pending').classList.add('hidden');return}try{$('myname').classList.remove('hidden');const nameSnap=await getDoc(doc(db,'userProfiles',user.uid));myPendingName=nameSnap.exists()?nameSnap.data().name||'':'';$('mynameinput').value=myPendingName;await watch()}catch(e){showPending();console.error(e);$('mynamehint').textContent='プロフィールを読み込めません。Firestoreルールを確認してください。'}});getRedirectResult(auth).catch(console.error);
document.addEventListener('click',async ev=>{let b=ev.target.closest('button');if(!b||!profile)return;if(b.dataset.tab){if(b.dataset.tab==='members'&&profile.role!=='admin')return;tab=b.dataset.tab;render();return}if(b.dataset.deleteEvent&&profile.role==='admin'){const id=b.dataset.deleteEvent;const event=events.find(e=>e.id===id);if(!event)return;const title=`${event.date} ${event.kind||'通常活動'}（${event.place}）`;if(!confirm(`${title} を削除しますか？\nこの予定と全員の出欠回答が削除され、元に戻せません。`))return;b.disabled=true;try{const answers=await getDocs(collection(db,'events',id,'answers'));await Promise.all(answers.docs.map(d=>deleteDoc(d.ref)));await deleteDoc(doc(db,'events',id));bulkDrafts.delete(id);notify('予定を削除しました')}catch(e){fail(e);b.disabled=false}return}if(b.dataset.answer){try{await setDoc(doc(db,'events',b.dataset.answer,'answers',me.uid),{value:b.dataset.value,updatedAt:serverTimestamp()})}catch(e){fail(e)}}if(b.dataset.remove&&profile.role==='admin'&&confirm('このメンバーの承認を取り消しますか？')){try{await deleteDoc(doc(db,'members',b.dataset.remove))}catch(e){fail(e)}}});
document.addEventListener('change',async ev=>{let el=ev.target;if(el.classList.contains('bulk-answer')){bulkDrafts.set(el.dataset.id,el.value);return}if(!profile||profile.role!=='admin'||!el.dataset.field)return;try{await updateDoc(doc(db,'events',el.dataset.id),{[el.dataset.field]:el.dataset.field==='allDay'?el.checked:el.value})}catch(e){fail(e)}});

const selectedDates=new Set();$('allDay').onchange=()=>{const disabled=$('allDay').checked;$('start').disabled=disabled;$('end').disabled=disabled};
function redrawDates(){const root=$('chosenDates');root.replaceChildren();for(const d of [...selectedDates].sort()){const row=document.createElement('span');row.style.cssText='display:inline-flex;align-items:center;gap:6px;margin:5px;padding:6px;background:#edf4ff;border-radius:8px';row.append(document.createTextNode(d));const x=document.createElement('button');x.textContent='×';x.onclick=()=>{selectedDates.delete(d);redrawDates()};row.append(x);root.append(row)}}
$('pushdate').onclick=()=>{const d=$('pickdate').value;if(!d){alert('日付を選んでください');return}if(selectedDates.size>=50&&!selectedDates.has(d)){alert('一度に50日までです');return}selectedDates.add(d);redrawDates()};
$('kind').onchange=()=>{$('customLabel').classList.toggle('hidden',$('kind').value!=='other')};
$('add').onclick=async()=>{if(!profile)return;const dates=[...selectedDates];const kind=$('kind').value==='other'?$('customKind').value.trim():$('kind').value;if(!dates.length){alert('日付を追加してください');return}if(!kind){alert('イベント名を入力してください');return}if(!$('place').value){alert('先に活動場所を追加してください');return}try{await Promise.all(dates.map(date=>addDoc(collection(db,'events'),{date,start:$('start').value,end:$('end').value,place:$('place').value,kind,allDay:$('allDay').checked,createdBy:me.uid,createdAt:serverTimestamp()})));selectedDates.clear();redrawDates();tab='future';notify('予定を登録しました');render()}catch(e){fail(e)}};
$('addplace').onclick=async()=>{if(!profile)return;let name=$('newplace').value.trim();if(!name)return;try{await addDoc(collection(db,'places'),{name,createdBy:me.uid});$('newplace').value=''}catch(e){fail(e)}};
$('savemyname').onclick=async()=>{if(!me)return;const name=$('mynameinput').value.trim();if(!name||name.length>30){alert('表示名を1〜30文字で入力してください');return}const btn=$('savemyname');btn.disabled=true;try{await setDoc(doc(db,'userProfiles',me.uid),{name,updatedAt:serverTimestamp()});myPendingName=name;if(profile){await updateDoc(doc(db,'members',me.uid),{name});profile.name=name;$('authstate').textContent='ログイン中：'+name;render()}else{$('mynamehint').textContent='登録名：'+name+'（承認を待っています）'}alert('表示名を保存しました')}catch(e){console.error(e);alert('名前を保存できませんでした。Firestoreルールを確認してください。\n'+e.message)}finally{btn.disabled=false}};
$('addmember').onclick=async()=>{if(profile?.role!=='admin')return;const uid=$('memberuid').value.trim();if(!uid){alert('ユーザーIDを入力してください');return}if(members.some(m=>m.id===uid)){alert('この人はすでに登録済みです');return}if(members.length>=10){alert('メンバーは10人までです');return}try{const nameSnap=await getDoc(doc(db,'userProfiles',uid));const name=nameSnap.exists()?nameSnap.data().name?.trim():'';if(!name){alert('相手の名前が未登録です。本人に名前を保存してもらってください');return}await setDoc(doc(db,'members',uid),{name,role:'member',order:members.length});$('memberuid').value='';notify(name+'さんを承認しました。相手にページを再読み込みしてもらってください')}catch(e){fail(e)}};

</script></body></html>
