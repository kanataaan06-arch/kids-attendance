// Japanese national holidays, including substitute holidays and citizens' holidays (2000–2099).
const holidayCache=new Map();
function japaneseHolidays(year){
  if(holidayCache.has(year))return holidayCache.get(year);
  const holidays=new Set();
  const add=(month,day)=>holidays.add(year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0'));
  const nthMonday=(month,n)=>{const first=new Date(Date.UTC(year,month-1,1)).getUTCDay();return 1+(8-first)%7+(n-1)*7};
  const spring=Math.floor(20.8431+0.242194*(year-1980)-Math.floor((year-1980)/4));
  const autumn=Math.floor(23.2488+0.242194*(year-1980)-Math.floor((year-1980)/4));
  add(1,1);add(1,nthMonday(1,2));add(2,11);
  if(year>=2020)add(2,23);
  add(3,spring);add(4,29);add(5,3);add(5,4);add(5,5);
  if(year===2020){add(7,23);add(8,10);add(9,nthMonday(9,3));add(9,autumn);add(11,3);add(11,23);add(7,24)}
  else if(year===2021){add(7,22);add(7,23);add(8,8);add(9,nthMonday(9,3));add(9,autumn);add(11,3);add(11,23)}
  else{add(7,nthMonday(7,3));if(year>=2016)add(8,11);add(9,nthMonday(9,3));add(9,autumn);add(10,nthMonday(10,2));add(11,3);add(11,23)}
  if(year<=2018)add(12,23);
  // A one-off national holiday for the enthronement in 2019.
  if(year===2019){add(5,1);add(10,22)}
  const key=d=>d.toISOString().slice(0,10);
  const start=new Date(Date.UTC(year,0,1)),end=new Date(Date.UTC(year+1,0,1));
  // Citizens' holidays: a weekday between two national holidays.
  for(let d=new Date(start);d<end;d.setUTCDate(d.getUTCDate()+1)){
    if(d.getUTCDay()===0||holidays.has(key(d)))continue;
    const prev=new Date(d),next=new Date(d);prev.setUTCDate(prev.getUTCDate()-1);next.setUTCDate(next.getUTCDate()+1);
    if(holidays.has(key(prev))&&holidays.has(key(next)))holidays.add(key(d));
  }
  const national=[...holidays];

  for(const h of national){const d=new Date(h+'T00:00:00Z');if(d.getUTCDay()!==0)continue;

  }

マ','マルチ','パフォ','研修室'].includes(e.place)?'hidden':''}" data-custom-place-wrap="${esc(e.id)}">活動場所を自由入力<input data-field="place" data-id="${esc(e.id)}" maxlength="100" placeholder="活動場所を入力" value="${esc(e.place||'')}"></label><label class="wide" style="flex-direction:row;align-items:center"><input type="checkbox" data-field="allDay" data-id="${esc(e.id)}" ${e.allDay?"checked":""} style="width:auto"> 終日</label><label>開始<input type="time" data-field="start" data-id="${esc(e.id)}" value="${esc(e.start)}" ${e.allDay?"disabled":""}></label><label>終了<input type="time" data-field="end" data-id="${esc(e.id)}" value="${esc(e.end)}" ${e.allDay?"disabled":""}></label></div><div class="row"><button type="button" class="danger" data-delete-event="${esc(e.id)}">この予定を削除</button></div><p class="small muted">出欠は本人のみ変更可能。予定の編集・削除は管理者のみ可能。</p>`:'<p class="small muted">出欠はいつでも本人だけが変更できます。</p>'}</details></article>`}

  const el=$('unansweredAlert');
  const unanswered=future.filter(e=>!['○','△','×'].includes(e.answers?.[me.uid]));
  if(!unanswered.length){el.classList.add('hidden');el.open=false;$('unansweredList').replaceChildren();return}
  el.classList.remove('hidden');
  $('unansweredSummary').textContent=`未回答の活動があります（${unanswered.length}件）`;
  $('unansweredList').innerHTML='<div class="small" style="padding:6px 3px;color:#a32323">タップすると該当する活動へ移動します。</div>'+unanswered.map(e=>`<button type="button" class="unanswered-item" data-open-event="${esc(e.id)}"><strong class="${dateColorClass(e.date)}">${dateLabel(e.date)}</strong>　${e.allDay?'終日':esc(e.start||'')}　${esc(e.kind||'通常活動')}・${esc(e.place||'')}</button>`).join('');
}
function render(){if(!profile||!me)return;let ts=today(),sorted=[...events].sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));let future=sorted.filter(e=>e.date>=ts),past=sorted.filter(e=>e.date<ts).reverse();for(let t of ['future','bulk','create','past','members']){$(t).classList.toggle('hidden',t!==tab);document.querySelector(`[data-tab="${t}"]`)?.classList.toggle('active',t===tab)}$('membersTab').classList.toggle('hidden',profile.role!=='admin');if(profile.role!=='admin'&&tab==='members'){tab='future';return render()}$('future').innerHTML=future.length?future.map(card).join(''):'<div class="card">今後の活動はありません。</div>';renderUnanswered(future);renderPast(past);$('bulk').innerHTML=`<div class="card"><h3>${esc(profile.name)}の出欠をまとめて回答</h3><p class="muted">○・△・×をタップして選択し、最後に「まとめて保存」を押してください。</p>${future.map(e=>`<div class="bulk-entry"><div class="bulk-info"><strong class="${dateColorClass(e.date)}">${dateLabel(e.date)}</strong><span class="small">${e.allDay?"終日":esc(e.start)} ${esc(e.kind||"通常活動")}・${esc(e.place)}</span></div><div class="bulk-options" role="radiogroup" aria-label="${esc(e.date)}の出欠">${['○','△','×'].map(v=>`<label class="bulk-choice"><input type="radio" class="bulk-answer" name="bulk-${esc(e.id)}" data-id="${esc(e.id)}" value="${v}" ${v===(bulkDrafts.has(e.id)?bulkDrafts.get(e.id):e.answers?.[me.uid])?'checked':''}><span>${v}</span></label>`).join('')}</div></div>`).join('')}<div class="row"><button class="primary" id="savebulk">まとめて保存</button></div></div>`;$('savebulk').onclick=async()=>{const entries=[...document.querySelectorAll('.bulk-answer:checked')];const btn=$('savebulk');btn.disabled=true;try{await Promise.all(entries.map(el=>setDoc(doc(db,'events',el.dataset.id,'answers',me.uid),{value:el.value,updatedAt:serverTimestamp()})));bulkDrafts.clear();tab='future';notify('出欠を保存しました');render()}catch(e){fail(e)}finally{btn.disabled=false}};
$('memberlist').innerHTML=members.map(m=>`<div class="row"><span>${esc(m.name)}（${m.role==='admin'?'管理者':'メンバー'}）</span><span class="muted">${esc(m.id)}</span>${m.role!=='admin'?`<button data-remove="${esc(m.id)}" class="danger">承認を取り消す</button>`:''}</div>`).join('')}
async function watch(){clean();let snap=await getDoc(doc(db,'members',me.uid));if(!snap.exists()){showPending();return}profile={id:me.uid,...snap.data()};$('mynameinput').value=profile.name||'';$('mynamehint').textContent='名前はいつでも変更できます。';$('pending').classList.add('hidden');$('app').classList.remove('hidden');$('authstate').textContent='ログイン中：'+profile.name;
unsubs.push(onSnapshot(collection(db,'members'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??99)-(b.order??99));const own=members.find(m=>m.id===me.uid);if(own){profile={...own};$('authstate').textContent='ログイン中：'+own.name}render()},fail));

unsubs.push(onSnapshot(collection(db,'events'),s=>{answerUnsubs.forEach(fn=>fn());answerUnsubs=[];events=s.docs.map(d=>({id:d.id,...d.data(),answers:{}}));for(const e of events){answerUnsubs.push(onSnapshot(collection(db,'events',e.id,'answers'),ans=>{let target=events.find(x=>x.id===e.id);if(target){target.answers=Object.fromEntries(ans.docs.map(a=>[a.id,a.data().value]));render()}},fail))}render()},fail));}
function showPending(){$('unansweredAlert').classList.add('hidden');$('unansweredAlert').open=false;$('app').classList.add('hidden');$('pending').classList.remove('hidden');$('uid').textContent=me.uid;$('authstate').textContent='承認待ち';$('mynamehint').textContent=myPendingName?'登録名：'+myPendingName+'（承認を待っています）':'先に表示名を登録してください。';}
$('login').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==='auth/popup-blocked'){await signInWithRedirect(auth,provider)}else{alert('ログインに失敗しました：'+e.message)}}};$('logout').onclick=()=>signOut(auth);$('copyuid').onclick=()=>navigator.clipboard.writeText(me.uid).then(()=>alert('コピーしました')).catch(()=>alert('コピーできない場合は表示されたIDを選択してください'));
onAuthStateChanged(auth,async user=>{clean();me=user;$('login').classList.toggle('hidden',!!user);$('logout').classList.toggle('hidden',!user);$('identity').textContent=user?.email||'';if(!user){$('unansweredAlert').classList.add('hidden');$('unansweredAlert').open=false;$('myname').classList.add('hidden');$('authstate').textContent='ログインしてください';$('app').classList.add('hidden');$('pending').classList.add('hidden');return}try{$('myname').classList.remove('hidden');const nameSnap=await getDoc(doc(db,'userProfiles',user.uid));myPendingName=nameSnap.exists()?nameSnap.data().name||'':'';$('mynameinput').value=myPendingName;await watch();if(user.photoURL&&profile&&profile.photoURL!==user.photoURL){try{await updateDoc(doc(db,'members',user.uid),{photoURL:user.photoURL})}catch(err){console.warn('プロフィール画像の保存にはFirestoreルールの更新が必要です',err)}}}catch(e){showPending();console.error(e);$('mynamehint').textContent='プロフィールを読み込めません。Firestoreルールを確認してください。'}});getRedirectResult(auth).catch(console.error);
document.addEventListener('click',async ev=>{let b=ev.target.closest('button');if(!b||!profile)return;if(b.dataset.openEvent){tab='future';render();const target=[...document.querySelectorAll('#future [data-event-id]')].find(el=>el.dataset.eventId===b.dataset.openEvent);if(target){const details=target.querySelector('details');if(details)details.open=true;target.scrollIntoView({behavior:'smooth',block:'start'})}return}if(b.dataset.tab){if(b.dataset.tab==='members'&&profile.role!=='admin')return;tab=b.dataset.tab;render();return}if(b.dataset.deleteEvent&&profile.role==='admin'){const id=b.dataset.deleteEvent;const event=events.find(e=>e.id===id);if(!event)return;const title=`${event.date} ${event.kind||'通常活動'}（${event.place}）`;if(!confirm(`${title} を削除しますか？\nこの予定と全員の出欠回答が削除され、元に戻せません。`))return;b.disabled=true;try{const answers=await getDocs(collection(db,'events',id,'answers'));await Promise.all(answers.docs.map(d=>deleteDoc(d.ref)));await deleteDoc(doc(db,'events',id));bulkDrafts.delete(id);notify('予定を削除しました')}catch(e){fail(e);b.disabled=false}return}if(b.dataset.answer){try{await setDoc(doc(db,'events',b.dataset.answer,'answers',me.uid),{value:b.dataset.value,updatedAt:serverTimestamp()})}catch(e){fail(e)}}if(b.dataset.remove&&profile.role==='admin'){
  const departing=members.find(m=>m.id===b.dataset.remove);
  if(!departing)return;
  if(!confirm(`${departing.name}さんの承認を取り消しますか？\n過去の活動には名前・出欠を残し、今後の活動からは表示を外します。`))return;
  b.disabled=true;
  try{
    // Keep the person's identity on every historical event before revoking access.
    // Answer documents remain untouched.
    const history=events.filter(e=>e.date<today());
    const snapshot={id:departing.id,name:departing.name,...(departing.photoURL?{photoURL:departing.photoURL}:{})};
    for(let i=0;i<history.length;i+=400){
      const batch=writeBatch(db);
      for(const e of history.slice(i,i+400)){
        const former=[...(e.formerMembers||[]).filter(m=>m.id!==departing.id),snapshot];
        batch.update(doc(db,'events',e.id),{formerMembers:former});
      }
      await batch.commit();
    }
    await deleteDoc(doc(db,'members',departing.id));
    notify(`${departing.name}さんの承認を解除しました。過去の活動記録は保存されています。`);
  }catch(e){fail(e)}finally{b.disabled=false}
}});
document.addEventListener('change',async ev=>{let el=ev.target;if(el.classList.contains('bulk-answer')){bulkDrafts.set(el.dataset.id,el.value);return}if(!profile||profile.role!=='admin')return;
if(el.dataset.placeChoice){
  const id=el.dataset.placeChoice;
  const wrap=[...document.querySelectorAll('[data-custom-place-wrap]')].find(x=>x.dataset.customPlaceWrap===id);
  if(wrap)wrap.classList.toggle('hidden',el.value!=='custom');
  if(el.value==='custom'){wrap?.querySelector('input')?.focus();return}
  try{await updateDoc(doc(db,'events',id),{place:el.value})}catch(e){fail(e)}
  return;
}
if(!el.dataset.field)return;
if(el.dataset.field==='place'&&!el.value.trim()){alert('活動場所を入力してください');return}
try{await updateDoc(doc(db,'events',el.dataset.id),{[el.dataset.field]:el.dataset.field==='allDay'?el.checked:el.value.trim()})}catch(e){fail(e)}});

const selectedDates=new Set();
document.querySelectorAll('input[name="placePreset"]').forEach(el=>el.addEventListener('change',()=>{
  $('customPlaceLabel').classList.toggle('hidden',document.querySelector('input[name="placePreset"]:checked')?.value!=='自由入力');
}));
function updateTimePreset(){
  const value=document.querySelector('input[name="timePreset"]:checked')?.value||'09:00-18:00';
  $('allDay').checked=value==='allDay';
  $('customTimes').classList.toggle('hidden',value!=='custom');
  if(value==='custom'){$('start').disabled=false;$('end').disabled=false;return}
  if(value==='allDay'){$('start').value='00:00';$('end').value='00:00';return}
  const [start,end]=value.split('-');$('start').value=start;$('end').value=end;
}
document.querySelectorAll('input[name="timePreset"]').forEach(el=>el.addEventListener('change',()=>{
  if(el.checked&&el.value==='custom'){$('start').value='00:00';$('end').value='00:00'}
  updateTimePreset();
}));
updateTimePreset();
function redrawDates(){const root=$('chosenDates');root.replaceChildren();for(const d of [...selectedDates].sort()){const row=document.createElement('span');row.style.cssText='display:inline-flex;align-items:center;gap:6px;margin:5px;padding:6px;background:#edf4ff;border-radius:8px';row.classList.add(dateColorClass(d));row.append(document.createTextNode(dateLabel(d)));const x=document.createElement('button');x.textContent='×';x.onclick=()=>{selectedDates.delete(d);redrawDates()};row.append(x);root.append(row)}}
$('pushdate').onclick=()=>{const d=$('pickdate').value;if(!d){alert('日付を選んでください');return}if(selectedDates.size>=50&&!selectedDates.has(d)){alert('一度に50日までです');return}selectedDates.add(d);redrawDates()};
document.querySelectorAll('input[name="kindPreset"]').forEach(el=>el.addEventListener('change',()=>{$('customLabel').classList.toggle('hidden',document.querySelector('input[name="kindPreset"]:checked')?.value!=='other')}));
$('add').onclick=async()=>{if(!profile)return;const dates=[...selectedDates];const chosenKind=document.querySelector('input[name="kindPreset"]:checked')?.value||'通常活動';const kind=chosenKind==='other'?$('customKind').value.trim():chosenKind;updateTimePreset();if(!dates.length){alert('日付を追加してください');return}if(!kind){alert('イベント名を入力してください');return}const selectedPlace=document.querySelector('input[name="placePreset"]:checked')?.value||'里山';const place=selectedPlace==='自由入力'?$('customPlace').value.trim():selectedPlace;if(!place){alert('活動場所を入力してください');return}try{await Promise.all(dates.map(date=>addDoc(collection(db,'events'),{date,start:$('start').value,end:$('end').value,place,kind,allDay:$('allDay').checked,createdBy:me.uid,createdAt:serverTimestamp()})));selectedDates.clear();redrawDates();tab='future';notify('予定を登録しました');render()}catch(e){fail(e)}};

$('savemyname').onclick=async()=>{if(!me)return;const name=$('mynameinput').value.trim();if(!name||name.length>30){alert('表示名を1〜30文字で入力してください');return}const btn=$('savemyname');btn.disabled=true;try{await setDoc(doc(db,'userProfiles',me.uid),{name,updatedAt:serverTimestamp()});myPendingName=name;if(profile){await updateDoc(doc(db,'members',me.uid),{name});profile.name=name;$('authstate').textContent='ログイン中：'+name;render()}else{$('mynamehint').textContent='登録名：'+name+'（承認を待っています）'}alert('表示名を保存しました')}catch(e){console.error(e);alert('名前を保存できませんでした。Firestoreルールを確認してください。\n'+e.message)}finally{btn.disabled=false}};
$('addmember').onclick=async()=>{if(profile?.role!=='admin')return;const uid=$('memberuid').value.trim();if(!uid){alert('ユーザーIDを入力してください');return}if(members.some(m=>m.id===uid)){alert('この人はすでに登録済みです');return}if(members.length>=10){alert('メンバーは10人までです');return}try{const nameSnap=await getDoc(doc(db,'userProfiles',uid));const name=nameSnap.exists()?nameSnap.data().name?.trim():'';if(!name){alert('相手の名前が未登録です。本人に名前を保存してもらってください');return}await setDoc(doc(db,'members',uid),{name,role:'member',order:members.length});$('memberuid').value='';notify(name+'さんを承認しました。相手にページを再読み込みしてもらってください')}catch(e){fail(e)}};

</script></body></html>
